# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Harmonia
site_description: AI ajan destekli tam otomatik hazır proje template platformu
site_url: https://drokian.github.io/harmonia-platform/
repo_url: https://github.com/drokian/harmonia-platform
repo_name: drokian/harmonia-platform
edit_uri: edit/develop/docs/

theme:
  name: material
  language: tr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Koyu temaya geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Açık temaya geç
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: tr
          default: true
          name: Türkçe
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Ana Sayfa: Home
            Başlarken: Getting Started
            Templates: Templates
            Rehberler: Guides
            Yenilikler: What's New
            Hakkında: About

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

nav:
  - Ana Sayfa: index.md
  - Başlarken:
      - Workspace Oluşturma: getting-started/scaffold.md
      - İlk Template: getting-started/first-template.md
  - Templates:
      - workspace-with-demo: templates/workspace-with-demo.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/drokian/harmonia-platform
