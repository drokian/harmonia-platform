name: Release

on:
  push:
    branches:
      - main
    paths:
      - TEMPLATE_VERSION
      - TEMPLATE_CHANGELOG.md
      - README.md
  workflow_dispatch:
    inputs:
      version:
        description: "Optional. If omitted, TEMPLATE_VERSION will be used."
        required: false
        type: string
      draft:
        description: "Create draft release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  validate-release-metadata:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release-gate.outputs.should_release }}
      release_version: ${{ steps.resolve-version.outputs.release_version }}
      release_draft: ${{ steps.resolve-version.outputs.release_draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if release should run
        id: release-gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          current_sha="${{ github.sha }}"

          changed_files="$(git diff --name-only "$before_sha" "$current_sha")"
          echo "Changed files on push:"
          echo "$changed_files"

          if echo "$changed_files" | grep -qx "TEMPLATE_VERSION"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release version
        id: resolve-version
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: |
          input_version="${{ github.event.inputs.version }}"
          file_version="$(tr -d '\r\n' < TEMPLATE_VERSION)"
          input_draft="${{ github.event.inputs.draft }}"

          if [[ -n "$input_version" ]]; then
            release_version="$input_version"
          else
            release_version="$file_version"
          fi

          if [[ "${{ github.event_name }}" = "workflow_dispatch" ]]; then
            if [[ "$input_draft" = "false" ]]; then
              release_draft="false"
            else
              release_draft="true"
            fi
          else
            release_draft="false"
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_draft=$release_draft" >> "$GITHUB_OUTPUT"

      - name: Stop job when release is not required
        if: steps.release-gate.outputs.should_release != 'true'
        shell: bash
        run: |
          echo "No TEMPLATE_VERSION change on push. Skipping release steps."

      - name: Validate version input against TEMPLATE_VERSION
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: |
          input_version="${{ steps.resolve-version.outputs.release_version }}"
          file_version="$(tr -d '\r\n' < TEMPLATE_VERSION)"

          if [[ -z "$file_version" ]]; then
            echo "TEMPLATE_VERSION is empty"
            exit 1
          fi

          if [[ "$input_version" != "$file_version" ]]; then
            echo "Version mismatch"
            echo "workflow input : $input_version"
            echo "TEMPLATE_VERSION: $file_version"
            exit 1
          fi

          if ! [[ "$file_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "TEMPLATE_VERSION must follow semver with v prefix (example v1.2.3)"
            exit 1
          fi

          echo "Version input validated: $file_version"

      - name: Validate changelog entry for version
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: |
          file_version="$(tr -d '\r\n' < TEMPLATE_VERSION)"
          if ! grep -Eq "^## ${file_version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" TEMPLATE_CHANGELOG.md; then
            echo "Missing changelog heading for ${file_version}"
            echo "Expected pattern: ## ${file_version} - YYYY-MM-DD"
            exit 1
          fi

          echo "Changelog entry validated for ${file_version}"

      - name: Validate baseline section in README
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: |
          file_version="$(tr -d '\r\n' < TEMPLATE_VERSION)"
          expected_line="Current baseline: \`${file_version}\`"
          if ! grep -Fq "$expected_line" README.md; then
            echo "README baseline section is not aligned with TEMPLATE_VERSION"
            exit 1
          fi

          echo "README baseline section validated"

      - name: Ensure tag does not already exist
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: |
          version="${{ steps.resolve-version.outputs.release_version }}"
          git fetch --tags

          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Tag already exists: $version"
            exit 1
          fi

          echo "Tag is available: $version"

      - name: Create and push tag
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: |
          version="${{ steps.resolve-version.outputs.release_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$version" -m "Template release $version"
          git push origin "$version"

      - name: Generate release notes
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: |
          version="${{ steps.resolve-version.outputs.release_version }}"

          awk -v ver="$version" '
            $0 ~ "^## " ver " - " {capture=1; next}
            $0 ~ "^## v[0-9]+\\.[0-9]+\\.[0-9]+ - " && capture {exit}
            capture {print}
          ' TEMPLATE_CHANGELOG.md > TEMPLATE_SECTION.md

          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$version" | head -n1 || true)"

          if [[ -n "$previous_tag" ]]; then
            commit_range="$previous_tag..HEAD"
          else
            commit_range="HEAD"
          fi

          {
            echo "## $version"
            echo ""
            echo "### Template Changelog"
            echo ""
            if [ -s TEMPLATE_SECTION.md ]; then
              cat TEMPLATE_SECTION.md
            else
              echo "- No explicit template changelog notes found for this version."
            fi
            echo ""
            echo "### Commits"
            echo ""
            git log "$commit_range" --pretty=format:"- %s (%h)" || true
            echo ""
          } > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Failed to generate release notes for $version"
            exit 1
          fi

          echo "Release notes generated"

      - name: Create GitHub draft release
        if: steps.release-gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-version.outputs.release_version }}
          name: Template ${{ steps.resolve-version.outputs.release_version }}
          body_path: RELEASE_NOTES.md
          draft: ${{ steps.resolve-version.outputs.release_draft == 'true' }}
          prerelease: false