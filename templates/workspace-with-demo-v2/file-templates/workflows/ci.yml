name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies if package.json exists
        shell: bash
        run: |
          if [ -f package.json ] && { [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; }; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json at workspace root, skipping npm install"
          fi

      - name: Run tests placeholder
        run: echo "TODO: add project-specific test command"
